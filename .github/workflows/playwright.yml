name: Playwright Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --browser ${{ matrix.browser }} --reporter=html,junit --output=test-results
        continue-on-error: true

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.browser }}
          path: playwright-report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results

  email_notification:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Send Email on Commit
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Playwright CI - Commit Test Results"
          to: nikkbhai9090@gmail.com
          from: CI Bot <girishstudy124@gmail.com>
          body: |
            Hello,

            Playwright tests have completed.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            View full workflow run and download reports here:
            https://github.com/girishsuthar229/automation-with-playwright/actions/runs/${{ github.run_id }}

            Regards,
            CI Bot
          secure: true
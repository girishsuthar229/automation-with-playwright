name: Playwright Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        continue-on-error: true

      - name: Upload HTML Report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Deploy HTML Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: reports/html

  email_notification:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ vars.SEND_EMAIL == 'true' }}
    steps:
      - name: Send Email on Commit
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Playwright CI - Commit Test Results"
          to: nikkbhai9090@gmail.com
          from: CI Bot <girishstudy124@gmail.com>
          body: |
            Playwright Test Execution Completed

            📊 Full Test Report (PASS + FAIL + SKIP):
            https://girishsuthar229.github.io/automation-with-playwright/

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            Regards,
            CI Bot
          secure: true